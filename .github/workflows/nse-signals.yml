name: NSE signal alerts

on:
  schedule:
    # Every 5 minutes, 03:00-10:59 UTC = 08:30-16:29 IST, Monday-Friday.
    # The script itself skips anything outside 09:20-15:35 IST.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:        # lets you press "Run workflow" to send a test message

permissions:
  contents: read

concurrency:
  group: nse-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STRATEGY: ${{ vars.STRATEGY || '1' }}     # optional repo variable: 1 or 2
      SYMBOLS: ${{ vars.SYMBOLS }}              # optional repo variable, e.g. "RELIANCE SBIN TCS"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore list of alerts already sent
        uses: actions/cache/restore@v4
        with:
          path: sent_signals.json
          key: sent-signals-${{ github.run_id }}
          restore-keys: sent-signals-

      - name: Send test message (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python nse_signal_agent.py --test-alert

      - name: Scan and alert
        if: github.event_name == 'schedule'
        run: python nse_signal_agent.py --alert --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Save list of alerts already sent
        if: github.event_name == 'schedule' && always()
        uses: actions/cache/save@v4
        with:
          path: sent_signals.json
          key: sent-signals-${{ github.run_id }}
          
