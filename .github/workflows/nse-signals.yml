name: NSE signal alerts

on:
  schedule:
    # Every 5 minutes, 03:00-10:59 UTC = 08:30-16:29 IST, Monday-Friday.
    # The script itself skips anything outside 09:20-16:00 IST.
    - cron: "*/5 3-10 * * 1-5"
    # Day summary at 10:40 UTC = 16:10 IST, Monday-Friday.
    - cron: "40 10 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for manual tests
    inputs:
      mode:
        description: "What should this manual run do?"
        type: choice
        default: snapshot
        options:
          - snapshot        # send current status of every stock to Telegram
          - signals         # check for new BUY/SELL signals now (even outside market hours)
          - summary         # list every signal that fired today
          - test            # just send a "connected" message

permissions:
  contents: read

concurrency:
  group: nse-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STRATEGY: ${{ vars.STRATEGY || '1' }}     # optional repo variable: 1 or 2
      SYMBOLS: ${{ vars.SYMBOLS }}              # optional repo variable, e.g. "RELIANCE SBIN TCS"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore list of alerts already sent
        uses: actions/cache/restore@v4
        with:
          path: sent_signals.json
          key: sent-signals-${{ github.run_id }}
          restore-keys: sent-signals-

      - name: Manual - test message
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python nse_signal_agent.py --test-alert ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Manual - snapshot of all stocks
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot'
        run: python nse_signal_agent.py --snapshot --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Manual - check signals now
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'signals'
        run: python nse_signal_agent.py --alert --force --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Manual - day summary
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'summary'
        run: python nse_signal_agent.py --summary --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Scheduled - day summary
        if: github.event_name == 'schedule' && github.event.schedule == '40 10 * * 1-5'
        run: python nse_signal_agent.py --summary --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Scheduled - scan and alert
        if: github.event_name == 'schedule' && github.event.schedule != '40 10 * * 1-5'
        run: python nse_signal_agent.py --alert --strategy "$STRATEGY" ${SYMBOLS:+--symbols $SYMBOLS}

      - name: Save list of alerts already sent
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'signals')
        uses: actions/cache/save@v4
        with:
          path: sent_signals.json
          key: sent-signals-${{ github.run_id }}
